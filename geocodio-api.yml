    GeocodingResultWithDistance:
      type: object
      properties:
        input:
          type: object
          properties:
            address_components:
              $ref: '#/components/schemas/AddressComponents'
            formatted_address:
              type: string
        results:
          $ref: '#/components/schemas/AddressResult'
        distance:
          $ref: '#/components/schemas/SingleDistanceResponse'

    DistanceQuery:
      type: object
      properties:
        targets:
          type: array
          description: List of addresses (string) or coordinates to compare against the origin.
          items:
            $ref: '#/components/schemas/DistanceTarget'
        mode:
          type: string
          description: Distance calculation mode.
          enum: [haversine, straightline, driving]
          default: driving
        units:
          type: string
          description: Unit for distances in the response.
          enum: [miles, km]
          default: miles
        max_results:
          type: integer
          description: Optional limit of results per origin (server-side filtering).
        max_distance:
          type: number
          description: Optional maximum distance filter (in selected units).
        max_duration:
          type: number
          description: Optional maximum driving duration filter in minutes (driving mode only).
        order_by:
          type: string
          description: Sort results by distance or duration.
          enum: [distance, duration]
        verify:
          type: boolean
          description: If true and targets include coordinates, also reverse geocode to validate plausibility.
      required: [targets]

    DistanceTarget:
      oneOf:
        - type: string
          description: Address string to be geocoded
        - type: object
          description: Coordinate target
          properties:
            lat:
              type: number
              format: float
            lon:
              type: number
              format: float
          required: [lat, lon]

    SingleDistanceResponse:
      type: object
      properties:
        mode:
          type: string
          enum: [haversine, straightline, driving]
        units:
          type: string
          enum: [miles, km]
        origin:
          type: object
          properties:
            location:
              type: array
              items:
                type: number
              minItems: 2
              maxItems: 2
        targets:
          type: array
          items:
            type: object
            properties:
              input:
                oneOf:
                  - type: string
                  - type: object
                    properties:
                      lat:
                        type: number
                      lon:
                        type: number
              resolved:
                type: object
                properties:
                  location:
                    type: array
                    items:
                      type: number
                    minItems: 2
                    maxItems: 2
              distance:
                type: number
              duration_minutes:
                type: number

    BatchGeocodeArrayAdvanced:
      type: array
      description: Batch array where each item can include its own parameters.
      items:
        type: object
        properties:
          id:
            type: string
          q:
            type: string
          distance:
            $ref: '#/components/schemas/DistanceQuery'
        required: [q]

    BatchGeocodeMatrixRequest:
      type: object
      description: Global matrix request using the batch geocode endpoint.
      properties:
        addresses:
          type: array
          description: Optional list that can serve as origins or destinations.
          items:
            type: string
        distance:
          type: object
          properties:
            origins:
              description: Use "addresses" to reference the addresses list, or provide explicit origins.
              oneOf:
                - type: string
                  enum: [addresses]
                - type: array
                  items:
                    $ref: '#/components/schemas/DistanceTarget'
            destinations:
              type: array
              items:
                $ref: '#/components/schemas/DistanceTarget'
            mode:
              type: string
              enum: [haversine, straightline, driving]
              default: driving
            units:
              type: string
              enum: [miles, km]
              default: miles
            max_results:
              type: integer
            max_distance:
              type: number
            max_duration:
              type: number
            order_by:
              type: string
              enum: [distance, duration]
            async:
              type: boolean
              description: If true, create an asynchronous matrix job and return a job_id.
          required: [destinations]

    DistanceMatrixResponse:
      type: object
      properties:
        distance:
          type: object
          properties:
            origins:
              type: array
              items:
                type: object
                properties:
                  index:
                    type: integer
                  id:
                    type: string
                    description: Optional ID from request for matching
                  location:
                    type: array
                    items:
                      type: number
                    minItems: 2
                    maxItems: 2
            destinations:
              type: array
              items:
                type: object
                properties:
                  index:
                    type: integer
                  id:
                    type: string
                    description: Optional ID from request for matching
                  location:
                    type: array
                    items:
                      type: number
                    minItems: 2
                    maxItems: 2
            distances:
              type: array
              items:
                type: array
                items:
                  type: number
            durations:
              type: array
              items:
                type: array
                items:
                  oneOf:
                    - type: number
                    - type: 'null'
            mode:
              type: string
              enum: [haversine, straightline, driving]
            units:
              type: string
              enum: [miles, km]
            elements_billed:
              type: integer

    BatchGeocodeLegacyResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              query:
                type: string
              response:
                $ref: '#/components/schemas/GeocodingResult'

    BatchGeocodePerRowDistanceResponse:
      type: array
      description: Array of per-row responses when using BatchGeocodeArrayAdvanced.
      items:
        type: object
        properties:
          id:
            type: string
          query:
            type: string
          response:
            $ref: '#/components/schemas/GeocodingResultWithDistance'

    DistanceCoordinate:
      oneOf:
        - type: string
          description: Coordinate string in "lat,lon" or "lat,lon,id" format (id is optional)
          example: "38.8977,-77.0365,clinic_a"
        - type: object
          description: Coordinate object with optional ID for matching
          properties:
            lat:
              type: number
              format: float
              example: 38.8977
            lon:
              type: number
              format: float
              example: -77.0365
            id:
              type: string
              description: Optional identifier to match this coordinate in the response
              example: "clinic_a"
          required: [lat, lon]

    DistanceGetResponse:
      type: object
      properties:
        origin:
          type: object
          properties:
            location:
              type: array
              items:
                type: number
              minItems: 2
              maxItems: 2
        mode:
          type: string
          enum: [haversine, straightline, driving]
        units:
          type: string
          enum: [miles, km]
        targets:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Optional ID from request for matching
              location:
                type: array
                items:
                  type: number
                minItems: 2
                maxItems: 2
              distance:
                type: number
              duration_minutes:
                type: number
        elements_billed:
          type: integer

    DistanceMatrixRequest:
      type: object
      properties:
        origins:
          type: array
          description: Array of origin coordinates (strings or objects)
          items:
            $ref: '#/components/schemas/DistanceCoordinate'
        destinations:
          type: array
          description: Array of destination coordinates (strings or objects)
          items:
            $ref: '#/components/schemas/DistanceCoordinate'
        mode:
          type: string
          enum: [haversine, straightline, driving]
          default: driving
        units:
          type: string
          enum: [miles, km]
          default: miles
      required: [origins, destinations]

    DistanceNearestRequest:
      type: object
      properties:
        origins:
          type: array
          description: Array of origin coordinates (strings or objects)
          items:
            $ref: '#/components/schemas/DistanceCoordinate'
        destinations:
          type: array
          description: Array of destination coordinates (strings or objects)
          items:
            $ref: '#/components/schemas/DistanceCoordinate'
        mode:
          type: string
          enum: [haversine, straightline, driving]
          default: driving
        units:
          type: string
          enum: [miles, km]
          default: miles
        max_results:
          type: integer
          minimum: 1
          description: Maximum number of results per origin
        max_distance:
          type: number
          description: Maximum distance filter in selected units
        max_duration:
          type: number
          description: Maximum driving duration filter in minutes (driving mode only)
        order_by:
          type: string
          enum: [distance, duration]
          default: distance
      required: [origins, destinations]

    DistanceNearestResponse:
      type: object
      properties:
        distance:
          type: object
          properties:
            mode:
              type: string
              enum: [haversine, straightline, driving]
            units:
              type: string
              enum: [miles, km]
            results:
              type: array
              items:
                type: object
                properties:
                  origin:
                    type: object
                    properties:
                      index:
                        type: integer
                      id:
                        type: string
                        description: Optional ID from request for matching
                      location:
                        type: array
                        items:
                          type: number
                        minItems: 2
                        maxItems: 2
                  targets:
                    type: array
                    items:
                      type: object
                      properties:
                        index:
                          type: integer
                        id:
                          type: string
                          description: Optional ID from request for matching
                        location:
                          type: array
                          items:
                            type: number
                          minItems: 2
                          maxItems: 2
                        distance:
                          type: number
                        duration_minutes:
                          type: number
            elements_billed:
              type: integer

    DistanceAsyncRequest:
      type: object
      properties:
        origins:
          type: array
          description: Array of origin coordinates (strings or objects)
          items:
            $ref: '#/components/schemas/DistanceCoordinate'
        destinations:
          type: array
          description: Array of destination coordinates (strings or objects)
          items:
            $ref: '#/components/schemas/DistanceCoordinate'
        mode:
          type: string
          enum: [haversine, straightline, driving]
          default: driving
        units:
          type: string
          enum: [miles, km]
          default: miles
        async:
          type: boolean
          description: Must be true for async job creation
        callback_url:
          type: string
          format: uri
          description: Optional webhook URL to receive job completion notification
        max_results:
          type: integer
          minimum: 1
          description: Optional maximum number of results per origin for nearest mode
        max_distance:
          type: number
          description: Optional maximum distance filter in selected units
        max_duration:
          type: number
          description: Optional maximum driving duration filter in minutes
        order_by:
          type: string
          enum: [distance, duration]
          default: distance
      required: [origins, destinations, async]

    DistanceJobResponse:
      type: object
      properties:
        job_id:
          type: string
          example: "dist_abc123def456"
        status:
          type: string
          enum: [queued, processing, completed, failed]
        estimated_elements:
          type: integer
        progress_percentage:
          type: integer
          minimum: 0
          maximum: 100
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        failed_at:
          type: string
          format: date-time
        error:
          type: string
          description: Error message if status is "failed"

    DistanceJobCompletedResponse:
      type: object
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [completed]
        estimated_elements:
          type: integer
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        result:
          oneOf:
            - $ref: '#/components/schemas/DistanceMatrixResponse'
            - $ref: '#/components/schemas/DistanceNearestResponse'

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message describing what went wrong
      required: [error]

  securitySchemes:
    geocodioApiKey:
      type: apiKey
      name: api_key
      in: query
