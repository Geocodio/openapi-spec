openapi: 3.0.1
info:
  title: Geocodio
  description: |
    Geocodio's RESTful API allows you to perform forward and reverse geocoding lookups. We support both batch requests as well as individual lookups.
    
    You can also optionally ask for data appends such as timezone, Congressional districts or similar things of that nature.
  termsOfService: https://www.geocod.io/terms-of-use/
  contact:
    email: hello@geocod.io
  version: 1.9.0
externalDocs:
  description: Find out more about Geocodio
  url: https://www.geocod.io
servers:
- url: https://api.geocod.io/v1.9
  description: Standard Geocodio API Endpoint
- url: https://api.enterprise.geocod.io/v1.9
  description: Special Geocodio API Endpoint for Enterprise Customers
tags:
- name: geocode
  description: Geocode addresses to coordinates
- name: reverse
  description: Reverse geocode coordinates to addresses
paths:
  /geocode:
    get:
      tags:
      - geocode
      summary: Geocode single address
      description: |
        You can either use the `q` parameter for a full address query or a combination of `street`, `city`, `state`, `postal_code`, and/or `country` for when the address is already stored as separate fields on your end.
      operationId: geocodeSingle
      parameters:
      - name: q
        in: query
        description: The query (i.e. address) to geocode
        schema:
          type: string
      - name: fields
        in: query
        description: Comma-separated list of fields to append
        schema:
          $ref: '#/components/schemas/Fields'
        style: form
        explode: false
      - name: street
        in: query
        example: 1600 Pennsylvania Ave NW
        description: Can be used as an alternative to the `q` parameter
        schema:
          type: string
      - name: street2
        in: query
        example: Apt 204
        description: Can be used as an alternative to the `q` parameter
        schema:
          type: string
      - name: city
        in: query
        example: Washington
        description: Can be used as an alternative to the `q` parameter
        schema:
          type: string
      - name: county
        in: query
        example: Washington
        description: Can be used as an alternative to the `q` parameter
        schema:
          type: string
      - name: state
        in: query
        example: DC
        description: Can be used as an alternative to the `q` parameter
        schema:
          type: string
      - name: postal_code
        in: query
        example: 20500
        description: Can be used as an alternative to the `q` parameter
        schema:
          type: string
      - name: country
        in: query
        example: US
        description: Defaults to USA
        schema:
          type: string
      - name: limit
        in: query
        example: US
        description: Optional parameter. The maximum number of results to return. The default is no limit.
        schema:
          type: integer
      - name: format
        in: query
        example: simple
        description: Optional parameter to change the output format of the JSON response to a different structure
        schema:
          type: string
          enum: [simple]

      - name: distance_targets
        in: query
        description: >-
          One or more targets to compare against the resolved origin. Each value
          can be an address string or a coordinate string in the form "lat,lon".
          Repeat the parameter to add multiple targets.
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true

      - name: distance_mode
        in: query
        description: Distance calculation mode.
        schema:
          type: string
          enum: [haversine, straightline, driving]
          default: driving

      - name: distance_units
        in: query
        description: Unit for distances in the response.
        schema:
          type: string
          enum: [miles, km]
          default: miles

      - name: distance_max_results
        in: query
        description: Optional limit of results to return (applies per origin).
        schema:
          type: integer
          minimum: 1

      - name: distance_max_distance
        in: query
        description: Optional maximum distance filter in selected units.
        schema:
          type: number

      - name: distance_max_duration
        in: query
        description: Optional maximum driving duration filter in minutes (driving mode only).
        schema:
          type: number

      - name: distance_order_by
        in: query
        description: Sort results by distance or duration.
        schema:
          type: string
          enum: [distance, duration]
          default: distance

      responses:
        200:
          description: Successfully geocoded address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeocodingResultWithDistance'
        422:
          description: A client error prevented the request from executing successfully (e.g. invalid address provided). A JSON object will be returned with an error key containing a full error message
        403:
          description: Invalid API key, or other reason why access is forbidden.
      security:
        - geocodioApiKey: []
    post:
      tags:
      - geocode
      summary: Geocode batch of addresses
      description: Up to 10,000 addresses can be geocoded per batch
      operationId: geocodeBatch
      parameters:
      - name: fields
        in: query
        description: Comma-separated list of fields to append
        schema:
          $ref: '#/components/schemas/Fields'
        style: form
        explode: false
      - name: limit
        in: query
        example: US
        description: Optional parameter. The maximum number of results to return. The default is no limit.
        schema:
          type: integer

      - name: distance_targets
        in: query
        description: >-
          One or more targets to compare against the resolved origin. Each value
          can be an address string or a coordinate string in the form "lat,lon".
          Repeat the parameter to add multiple targets.
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true

      - name: distance_mode
        in: query
        description: Distance calculation mode.
        schema:
          type: string
          enum: [haversine, straightline, driving]
          default: driving

      - name: distance_units
        in: query
        description: Unit for distances in the response.
        schema:
          type: string
          enum: [miles, km]
          default: miles

      - name: distance_max_results
        in: query
        description: Optional limit of results to return (applies per origin).
        schema:
          type: integer
          minimum: 1

      - name: distance_max_distance
        in: query
        description: Optional maximum distance filter in selected units.
        schema:
          type: number

      - name: distance_max_duration
        in: query
        description: Optional maximum driving duration filter in minutes (driving mode only).
        schema:
          type: number

      - name: distance_order_by
        in: query
        description: Sort results by distance or duration.
        schema:
          type: string
          enum: [distance, duration]
          default: distance

      requestBody:
        description: List of addresses to geocode. Can either be an array or an object with keys of your choice.
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/BatchGeocodeArray'
                - $ref: '#/components/schemas/BatchGeocodeObject'
                - $ref: '#/components/schemas/BatchGeocodeArrayAdvanced'
                - $ref: '#/components/schemas/BatchGeocodeMatrixRequest'
        required: true
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BatchGeocodeLegacyResponse'
                  - $ref: '#/components/schemas/BatchGeocodePerRowDistanceResponse'
                  - $ref: '#/components/schemas/DistanceMatrixResponse'
        403:
          description: Invalid API key, or other reason why access is forbidden.
      security:
        - geocodioApiKey: []
  /distance:
    get:
      tags:
      - distance
      summary: Calculate distance from one origin to one or more targets
      description: |
        Quick 1→1 or 1→N distance calculation via query parameters. Browser and curl friendly.
        All inputs must be coordinates in "lat,lon" format.
      operationId: distanceSingle
      parameters:
      - name: origin
        in: query
        required: true
        description: Origin coordinate in "lat,lon" or "lat,lon,id" format (id is optional)
        schema:
          type: string
        example: "38.8977,-77.0365"
      - name: targets
        in: query
        required: true
        description: >-
          One or more target coordinates in "lat,lon" or "lat,lon,id" format (id is optional).
          Repeat the parameter to add multiple targets.
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        example: ["37.3317,-122.0307", "39.80,-89.66,hospital_a"]
      - name: mode
        in: query
        description: Distance calculation mode
        schema:
          type: string
          enum: [haversine, straightline, driving]
          default: driving
      - name: units
        in: query
        description: Unit for distances in the response
        schema:
          type: string
          enum: [miles, km]
          default: miles
      - name: max_results
        in: query
        description: Optional limit of results to return
        schema:
          type: integer
          minimum: 1
      - name: max_distance
        in: query
        description: Optional maximum distance filter in selected units
        schema:
          type: number
      - name: max_duration
        in: query
        description: Optional maximum driving duration filter in minutes (driving mode only)
        schema:
          type: number
      - name: order_by
        in: query
        description: Sort results by distance or duration
        schema:
          type: string
          enum: [distance, duration]
          default: distance
      responses:
        200:
          description: Successfully calculated distances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistanceGetResponse'
              examples:
                simple:
                  summary: Simple 1→1 distance
                  value:
                    origin:
                      location: [38.8977, -77.0365]
                    mode: driving
                    units: miles
                    targets:
                      - location: [37.3317, -122.0307]
                        distance: 2796.4
                        duration_minutes: 2580.5
                    elements_billed: 1
                multiple:
                  summary: 1→N with filtering and IDs
                  value:
                    origin:
                      location: [39.78, -89.64]
                    mode: driving
                    units: km
                    targets:
                      - index: 0
                        id: "hospital_a"
                        location: [39.80, -89.66]
                        distance: 8.9
                        duration_minutes: 11.2
                      - index: 1
                        location: [39.81, -89.67]
                        distance: 10.2
                        duration_minutes: 12.8
                    elements_billed: 2
        422:
          description: Invalid coordinate format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        403:
          description: Invalid API key or access forbidden
      security:
        - geocodioApiKey: []
    post:
      tags:
      - distance
      summary: Calculate distance matrix (M×N) or nearest neighbors
      description: |
        Many-to-many distance calculations with two modes:
        - **Matrix mode**: Full M×N matrix of distances between all origins and destinations
        - **Nearest mode**: Server-side filtered results returning only nearest K destinations per origin

        Coordinates can be provided as strings ("lat,lon") or objects ({"lat": ..., "lon": ...}).
      operationId: distanceMatrix
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/DistanceMatrixRequest'
                - $ref: '#/components/schemas/DistanceNearestRequest'
            examples:
              matrix:
                summary: Full M×N matrix with IDs
                value:
                  origins:
                    - lat: 38.8977
                      lon: -77.0365
                      id: "office_dc"
                    - "34.31,-120.52"
                  destinations:
                    - lat: 37.3317
                      lon: -122.0307
                      id: "warehouse_ca"
                    - "34.00,-121.10"
                  mode: driving
                  units: miles
              nearest:
                summary: Nearest per origin with filtering and IDs
                value:
                  origins:
                    - "39.78,-89.64,store_a"
                  destinations:
                    - "39.80,-89.66,customer_1"
                    - lat: 39.81
                      lon: -89.67
                    - "39.82,-89.68"
                  mode: driving
                  units: km
                  max_results: 5
                  max_distance: 50
                  order_by: distance
      responses:
        200:
          description: Successfully calculated distance matrix or nearest results
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DistanceMatrixResponse'
                  - $ref: '#/components/schemas/DistanceNearestResponse'
              examples:
                matrix:
                  summary: Full matrix response with IDs
                  value:
                    distance:
                      origins:
                        - index: 0
                          id: "office_dc"
                          location: [38.8977, -77.0365]
                        - index: 1
                          location: [34.31, -120.52]
                      destinations:
                        - index: 0
                          id: "warehouse_ca"
                          location: [37.3317, -122.0307]
                        - index: 1
                          location: [34.00, -121.10]
                      distances:
                        - [2796.4, 285.1]
                        - [127.3, 215.8]
                      durations:
                        - [2580.5, 330.5]
                        - [133.1, 218.2]
                      mode: driving
                      units: miles
                      elements_billed: 4
                nearest:
                  summary: Nearest per origin response with IDs
                  value:
                    distance:
                      mode: driving
                      units: km
                      results:
                        - origin:
                            index: 0
                            id: "store_a"
                            location: [39.78, -89.64]
                          targets:
                            - index: 0
                              id: "customer_1"
                              location: [39.80, -89.66]
                              distance: 8.9
                              duration_minutes: 11.2
                            - index: 1
                              location: [39.81, -89.67]
                              distance: 10.2
                              duration_minutes: 12.8
                      elements_billed: 2
        422:
          description: Invalid coordinates in request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        403:
          description: Invalid API key or access forbidden
      security:
        - geocodioApiKey: []
  /distance/jobs:
    post:
      tags:
      - distance
      summary: Create async distance calculation job
      description: |
        For large matrix calculations (>10,000 elements), create an asynchronous job.
        Poll the job status endpoint or provide a webhook URL for completion notification.
      operationId: distanceJobCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DistanceAsyncRequest'
            examples:
              async_matrix:
                summary: Large async matrix job
                value:
                  origins:
                    - "38.8977,-77.0365"
                    - "34.31,-120.52"
                  destinations:
                    - "37.3317,-122.0307"
                    - "34.00,-121.10"
                  mode: driving
                  units: miles
                  async: true
                  callback_url: "https://example.com/webhook"
      responses:
        202:
          description: Job created and queued for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistanceJobResponse'
              example:
                job_id: "dist_abc123def456"
                status: "queued"
                estimated_elements: 1000000
                created_at: "2025-10-10T12:00:00Z"
        422:
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        403:
          description: Invalid API key or access forbidden
      security:
        - geocodioApiKey: []
    get:
      tags:
      - distance
      summary: List distance calculation jobs
      description: Retrieve all distance calculation jobs for the authenticated API key
      operationId: distanceJobsList
      parameters:
      - name: status
        in: query
        description: Filter jobs by status
        schema:
          type: string
          enum: [queued, processing, completed, failed]
      - name: limit
        in: query
        description: Maximum number of jobs to return
        schema:
          type: integer
          default: 100
          maximum: 1000
      responses:
        200:
          description: List of distance jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/DistanceJobResponse'
              example:
                jobs:
                  - job_id: "dist_abc123"
                    status: "completed"
                    estimated_elements: 10000
                    created_at: "2025-10-10T12:00:00Z"
                    completed_at: "2025-10-10T12:05:30Z"
        403:
          description: Invalid API key or access forbidden
      security:
        - geocodioApiKey: []
  /distance/jobs/{job_id}:
    get:
      tags:
      - distance
      summary: Get distance calculation job status and results
      description: |
        Retrieve the status and results of an async distance calculation job.
        When status is "completed", the full results are included in the response.
      operationId: distanceJobGet
      parameters:
      - name: job_id
        in: path
        required: true
        description: Job ID returned from job creation
        schema:
          type: string
        example: "dist_abc123def456"
      responses:
        200:
          description: Job status and results (if completed)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DistanceJobResponse'
                  - $ref: '#/components/schemas/DistanceJobCompletedResponse'
              examples:
                queued:
                  summary: Job still queued
                  value:
                    job_id: "dist_abc123"
                    status: "queued"
                    estimated_elements: 1000000
                    created_at: "2025-10-10T12:00:00Z"
                processing:
                  summary: Job processing
                  value:
                    job_id: "dist_abc123"
                    status: "processing"
                    estimated_elements: 1000000
                    progress_percentage: 45
                    created_at: "2025-10-10T12:00:00Z"
                completed:
                  summary: Job completed with results
                  value:
                    job_id: "dist_abc123"
                    status: "completed"
                    estimated_elements: 1000000
                    created_at: "2025-10-10T12:00:00Z"
                    completed_at: "2025-10-10T12:15:30Z"
                    result:
                      distance:
                        origins:
                          - index: 0
                            id: "location_a"
                            location: [38.8977, -77.0365]
                        destinations:
                          - index: 0
                            id: "location_b"
                            location: [37.3317, -122.0307]
                        distances: [[2796.4]]
                        durations: [[2580.5]]
                        mode: driving
                        units: miles
                        elements_billed: 1
                failed:
                  summary: Job failed
                  value:
                    job_id: "dist_abc123"
                    status: "failed"
                    estimated_elements: 1000000
                    created_at: "2025-10-10T12:00:00Z"
                    failed_at: "2025-10-10T12:05:00Z"
                    error: "Invalid coordinate format at origin index 42"
        404:
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        403:
          description: Invalid API key or access forbidden
      security:
        - geocodioApiKey: []
  /reverse:
    get:
      tags:
      - reverse
      summary: Reverse geocode single address
      operationId: reverseSingle
      parameters:
      - name: q
        in: query
        description: The query (i.e. latitude/longitude pair) to reverse geocode
        schema:
          type: string
          example: "38.9002898,-76.9990361"
      - name: fields
        in: query
        description: Comma-separated list of fields to append
        schema:
          $ref: '#/components/schemas/Fields'
        style: form
        explode: false
      responses:
        200:
          description: Successfully geocoded coordinate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReverseGeocodingResult'
        422:
          description: A client error prevented the request from executing successfully (e.g. invalid coordinate provided). A JSON object will be returned with an error key containing a full error message
        403:
          description: Invalid API key, or other reason why access is forbidden.
      security:
        - geocodioApiKey: []
    post:
      tags:
      - reverse
      summary: Reverse geocode batch of coordinates
      description: Up to 10,000 coordinates can be reverse geocoded per batch
      operationId: reverseBatch
      parameters:
      - name: fields
        in: query
        description: Comma-separated list of fields to append
        schema:
          $ref: '#/components/schemas/Fields'
        style: form
        explode: false
      requestBody:
        description: List of coordinates to reverse geocode. Can either be an array or an object with keys of your choice.
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/BatchReverseGeocodeArray'
                - $ref: '#/components/schemas/BatchReverseGeocodeObject'
        required: true
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        query:
                          type: string
                        response:
                          $ref: '#/components/schemas/ReverseGeocodingResult'
        403:
          description: Invalid API key, or other reason why access is forbidden.
      security:
        - geocodioApiKey: []
components:
  schemas:
    BatchGeocodeArray:
      type: array
      items:
        type: string
        example: "1109 N Highland St, Arlington, VA 22201"
        description: "When using a JSON array, results are guaranteed to be returned in the same order as they are requested."
    BatchGeocodeObject:
      type: object
      example:
        yourCustomKey: "1109 N Highland St, Arlington, VA 22201"
      description: "If a JSON object is posted, you can specify a custom key for each element of your choice. This can be useful to match queries up with your existing data after the request is complete."
    BatchReverseGeocodeArray:
      type: array
      items:
        type: string
        example: "35.9746000,-77.9658000"
        description: "When using a JSON array, results are guaranteed to be returned in the same order as they are requested."
    BatchReverseGeocodeObject:
      type: object
      example:
        yourCustomKey: "35.9746000,-77.9658000"
      description: "If a JSON object is posted, you can specify a custom key for each element of your choice. This can be useful to match queries up with your existing data after the request is complete."
    GeocodingResult:
      type: object
      properties:
        input:
          type: object
          properties:
            address_components:
              $ref: '#/components/schemas/AddressComponents'
            formatted_address:
              type: string
        results:
          $ref: '#/components/schemas/AddressResult'
    ReverseGeocodingResult:
      type: object
      properties:
        results:
          $ref: '#/components/schemas/AddressResult'
    AddressResult:
      type: array
      items:
        type: object
        properties:
          address_components:
            $ref: '#/components/schemas/AddressComponents'
          address_lines:
            type: array
            items:
              type: string
          formatted_address:
            type: string
          location:
            type: object
            properties:
              lat:
                type: number
                format: float
              lng:
                type: number
                format: float
          accuracy:
            type: number
            format: float
          accuracy_type:
            type: string
            enum:
              - rooftop
              - point
              - range_interpolation
              - nearest_rooftop_match
              - street_center
              - place
              - state
          source:
            type: string
          fields:
            type: object
            properties:
              congressional_districts:
                $ref: '#/components/schemas/FieldCongressionalDistricts'
              state_legislative_districts:
                $ref: '#/components/schemas/FieldStateLegislativeDistricts'
              school_districts:
                $ref: '#/components/schemas/FieldSchoolDistricts'
              timezone:
                $ref: '#/components/schemas/FieldTimezone'
              census:
                $ref: '#/components/schemas/FieldCensus'
              zip4:
                $ref: '#/components/schemas/FieldZip4'
              ffiec:
                $ref: '#/components/schemas/FieldFFIEC'
    FieldCongressionalDistricts:
      type: array
      items:
        type: object
        properties:
          name:
            type: string
          district_number:
            type: integer
          ocd_id:
            type: string
          congress_number:
            type: string
          congress_years:
            type: string
          proportion:
            type: number
          current_legislators:
            $ref: '#/components/schemas/FieldCongressionalDistrictLegislators'
    FieldCongressionalDistrictLegislators:
      type: array
      items:
        type: object
        properties:
          type:
            type: string
          seniority:
            type: string
          bio:
            type: object
            properties:
              last_name:
                type: string
              first_name:
                type: string
              birthday:
                type: string
              gender:
                type: string
              party:
                type: string
              photo_url:
                type: string
              photo_attribution:
                type: string
          contact:
            type: object
            properties:
              url:
                type: string
              address:
                type: string
              phone:
                type: string
              contact_form:
                type: string
          social:
            type: object
            properties:
              rss_url:
                type: string
              twitter:
                type: string
              facebook:
                type: string
              youtube:
                type: string
              youtube_id:
                type: string
          references:
            type: object
            properties:
              bioguide_id:
                type: string
              thomas_id:
                type: string
              opensecrets_id:
                type: string
              lis_id:
                type: string
              cspan_id:
                type: string
              govtrack_id:
                type: string
              votesmart_id:
                type: string
              ballotpedia_id:
                type: string
              washington_post_id:
                type: string
              icpsr_id:
                type: string
